services:
  - type: web
    name: commandia
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: COMMANDIA_SESSION_SECRET
        generateValue: true
      - key: COMMANDIA_DATA_FILE
        value: /data/state.json
      - key: COMMANDIA_FRONTEND_DIST
        value: frontend/dist
      - key: COMMANDIA_COOKIE_SECURE
        value: "true"
      - key: COMMANDIA_COOKIE_SAMESITE
        value: lax
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_API_KEY
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: COMMANDIA_API_KEY
        sync: false
    disk:
      name: commandia-data
      mountPath: /data
      sizeGB: 1
